<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none">
  <rect width="400" height="160" rx="12" fill="#f0f5fa"/>
  <!-- Gear icon -->
  <circle cx="200" cy="65" r="25" fill="none" stroke="#1B3A5C" stroke-width="3"/>
  <circle cx="200" cy="65" r="10" fill="#1B3A5C"/>
  <!-- Gear teeth -->
  <rect x="195" y="35" width="10" height="12" rx="2" fill="#1B3A5C"/>
  <rect x="195" y="83" width="10" height="12" rx="2" fill="#1B3A5C"/>
  <rect x="170" y="60" width="12" height="10" rx="2" fill="#1B3A5C"/>
  <rect x="218" y="60" width="12" height="10" rx="2" fill="#1B3A5C"/>
  <!-- User icons -->
  <circle cx="100" cy="50" r="12" fill="#006B7B" opacity="0.2"/>
  <circle cx="100" cy="46" r="5" fill="#006B7B" opacity="0.5"/>
  <path d="M90 58 Q100 65 110 58" fill="#006B7B" opacity="0.3"/>
  <circle cx="300" cy="50" r="12" fill="#1B3A5C" opacity="0.2"/>
  <circle cx="300" cy="46" r="5" fill="#1B3A5C" opacity="0.5"/>
