  <rect x="280" y="80" width="40" height="18" rx="9" fill="#1B3A5C" opacity="0.3"/>
  <circle cx="289" cy="89" r="7" fill="white"/>
  <text x="200" y="125" font-family="Arial" font-weight="700" font-size="14" fill="#1B3A5C" text-anchor="middle">System Administration</text>
  <text x="200" y="145" font-family="Arial" font-size="11" fill="#006B7B" text-anchor="middle" opacity="0.7">Users, products, branches, configuration</text>
</svg>
