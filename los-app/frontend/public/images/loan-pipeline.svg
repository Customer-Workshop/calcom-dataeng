<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none">
  <rect width="400" height="160" rx="12" fill="#f0f5fa"/>
  <!-- Pipeline stages -->
  <rect x="20" y="50" width="70" height="60" rx="6" fill="#1B3A5C"/>
  <text x="55" y="75" font-family="Arial" font-weight="600" font-size="10" fill="white" text-anchor="middle">Applied</text>
  <text x="55" y="92" font-family="Arial" font-weight="700" font-size="18" fill="white" text-anchor="middle">12</text>
  <path d="M95 80 L105 80" stroke="#006B7B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="110" y="50" width="70" height="60" rx="6" fill="#006B7B"/>
  <text x="145" y="75" font-family="Arial" font-weight="600" font-size="10" fill="white" text-anchor="middle">Review</text>
  <text x="145" y="92" font-family="Arial" font-weight="700" font-size="18" fill="white" text-anchor="middle">8</text>
  <path d="M185 80 L195 80" stroke="#006B7B" stroke-width="2"/>
  <rect x="200" y="50" width="70" height="60" rx="6" fill="#1B3A5C" opacity="0.7"/>
  <text x="235" y="75" font-family="Arial" font-weight="600" font-size="10" fill="white" text-anchor="middle">Approved</text>
  <text x="235" y="92" font-family="Arial" font-weight="700" font-size="18" fill="white" text-anchor="middle">5</text>
  <path d="M275 80 L285 80" stroke="#006B7B" stroke-width="2"/>
  <rect x="290" y="50" width="90" height="60" rx="6" fill="#006B7B" opacity="0.7"/>
  <text x="335" y="75" font-family="Arial" font-weight="600" font-size="10" fill="white" text-anchor="middle">Funded</text>
  <text x="335" y="92" font-family="Arial" font-weight="700" font-size="18" fill="white" text-anchor="middle">3</text>
  <!-- Title -->
  <text x="200" y="30" font-family="Arial" font-weight="700" font-size="14" fill="#1B3A5C" text-anchor="middle">Loan Pipeline</text>
  <text x="200" y="145" font-family="Arial" font-size="11" fill="#006B7B" text-anchor="middle" opacity="0.7">Track applications from submission to funding</text>
</svg>
